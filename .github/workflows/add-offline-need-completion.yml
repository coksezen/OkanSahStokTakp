name: One-time offline need completion

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply offline need completion patch
        run: python .github/scripts/add-offline-need-completion.py

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify build
        run: npm run build

      - name: Commit changes and cleanup
        run: |
          rm -f .github/scripts/add-offline-need-completion.py
          rm -f .github/workflows/add-offline-need-completion.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Support completing needs while offline"
          git push
