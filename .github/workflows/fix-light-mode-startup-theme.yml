name: One-time light mode startup theme fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply light mode fix
        run: python .github/scripts/fix-light-mode-startup-theme.py

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify build
        run: npm run build

      - name: Commit changes and cleanup
        run: |
          rm -f .github/scripts/fix-light-mode-startup-theme.py
          rm -f .github/workflows/fix-light-mode-startup-theme.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore light mode background after startup"
          git push
