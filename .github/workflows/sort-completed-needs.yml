name: One-time completed needs sort

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply completed needs sort
        run: python .github/scripts/sort-completed-needs.py

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify build
        run: npm run build

      - name: Commit changes and cleanup
        run: |
          rm -f .github/scripts/sort-completed-needs.py
          rm -f .github/workflows/sort-completed-needs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Move completed needs to bottom"
          git push
