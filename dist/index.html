<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f8fafc" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icon.svg" />

  <title>StokCep</title>

  <script>
    (()=>{
      const saved=localStorage.getItem('okan-sah-theme')
      const dark=saved ? saved==='dark' : (window.matchMedia?.('(prefers-color-scheme: dark)').matches || false)
      document.documentElement.classList.toggle('startup-dark',dark)
      const meta=document.querySelector('meta[name="theme-color"]')
      if(meta) meta.setAttribute('content',dark ? '#080d18' : '#f8fafc')
    })()
  </script>

  <style>
    html,
    body,
    #root {
      margin: 0;
      padding: 0;
      background: #f8fafc;
      min-height: 100%;
    }
    #startup {
      position: fixed;
      inset: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f8fafc;
      color: #0f172a;
    }


    html.startup-dark,
    html.startup-dark body,
    html.startup-dark #root,
    html.startup-dark #startup {
      background: #080d18;
    }

    html.startup-dark #startup {
      color: #f8fafc;
    }

    #startup-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: translateY(-90px);
    }

    #startup img {
      width: 90px;
      height: 90px;
      margin-bottom: 20px;
    }

    #startup strong {
      font-size: 32px;
      margin-bottom: 8px;
    }

    #startup span {
      font-size: 15px;
      opacity: 0.65;
    }
  </style>
  <script type="module" crossorigin src="/assets/index-BXPwWb5Z.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-DhxTLRlv.css">
</head>

<body>
  <div id="root">
    <div id="startup">
      <div id="startup-inner">
        <img src="/icon.svg" alt="Okan-Şah Gıda" />
        <strong>Okan-Şah Gıda</strong>
        <span>Stok ve Kantin Yönetimi</span>
      </div>
    </div>
  </div>

  <script>
    window.__STOKCEP_START__ = Date.now()
  </script>

</body>
</html>
